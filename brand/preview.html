<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corvin brand + fonts preview</title>
    <link rel="stylesheet" href="../fonts/ibm-plex/fonts.css" />
    <style>
      :root {
        --ink: #0b0d12;
        --slate: #161b2b;
        --indigo: #2f3d63;
        --mist: #8fa3d9;
        --gold: #c9a227;
        --paper: #e6e9f2;
        --snow: #f8fafc;
        --ink-text: #12141a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink-text);
        background: var(--snow);
      }
      body.dark {
        color: var(--paper);
        background: var(--ink);
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .mark {
        width: 64px;
        height: 64px;
        flex: none;
      }
      .word {
        font-weight: 600;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
        font-variant-numeric: tabular-nums;
        font-size: 1.25rem;
      }
      .panel {
        margin-top: 2rem;
        padding: 1.25rem;
        background: var(--paper);
        border: 1px solid var(--mist);
      }
      body.dark .panel {
        background: var(--slate);
        border-color: var(--indigo);
      }
      button {
        font: inherit;
        padding: 0.5rem 0.9rem;
        border: 2px solid var(--indigo);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--mist);
        outline-offset: 2px;
      }
      h1 {
        font-weight: 500;
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brand mark + self-hosted IBM Plex</h1>
      <p>
        Local preview only. Fonts load from
        <code>fonts/ibm-plex/</code> via relative CSS. No external font hosts.
      </p>
      <div class="row" aria-label="Corvin wordmark with mark">
        <img class="mark" src="./mark.svg" alt="Corvin mark" width="64" height="64" />
        <span class="word">Corvin</span>
      </div>
      <p class="mono" aria-label="Sample clock digits">05:00  04:59  00:09</p>
      <div class="panel">
        <p>Medium display sample for landing copy only.</p>
        <button type="button" id="theme">Toggle light / dark</button>
      </div>
    </main>
    <script>
      document.getElementById("theme").addEventListener("click", () => {
        document.body.classList.toggle("dark")
      })
    </script>
  </body>
</html>
